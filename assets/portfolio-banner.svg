<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan Jay Clark — Architecture into delivery</title>
  <desc id="desc">Microsoft 365, Power Platform and Applied AI. Navy banner with teal and violet connected architectural layers.</desc>
