name: Portfolio sample checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse public PowerShell samples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem ./case-studies/property-portfolio-dms/automation -Filter *.ps1) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax failed: $($file.Name)" }
          }
      - name: Run synthetic positive and failure cases
        shell: pwsh
        run: ./case-studies/property-portfolio-dms/automation/Test-Samples.ps1
